<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="styles/style.css"/>

  <title>scom</title>

</div>

  </div>

  <footer class="footer" id="footer">
    <div class="follow">
    <h1>FOLLOW US</h1>
    </div>

      <a href="https://www.facebook.com/profile.php?id=100088252988020&mibextid=rS40aB7S9Ucbxw6v" class="social" id="fb">

      </a>
      <a href="#" class="social" id="tiktok">

      </a>
      <a href="#" class="social" id="instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="#" class="social" id="x">

      </a>
      <a href="#" class="social" id="youtube">
        <i class="fab fa-youtube"></i>
      </a>
    </div><br>

      <div class="terms" id="holdings" >scom holdings</div>
      <div class="right" >© all right reserved. SCOM holding</div>
    </div>

    <div class="profile" id="profile">
      <img src='profile.jpg' >

    <div class="menu-item">

      <div class="menu-items" id="Announcements">Announcements</div>

      <div class="menu-items" id="photos">Photos</div>
